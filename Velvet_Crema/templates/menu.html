{% extends 'base.html' %}
{% load static %}
{% block title %}Menu | {{ shop.name }}{% endblock %}
{% block content %}
<h1>Our Menu</h1>
<div class="cards">
  {% for item in menu %}
  <div class="card">
    <img src="{% static 'images/' %}{{ item.image }}" alt="{{ item.name }}">
    <span class="tag">{{ item.type }}</span>
    <h3>{{ item.name }}</h3>
    <p class="price">&#8369;{{ item.price }}</p>
  </div>
  {% endfor %}
</div>
{% endblock %}
